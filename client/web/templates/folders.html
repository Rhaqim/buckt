{{ define "folders" }}{{ range . }}
<div
	class="folder-card drop-indicator bg-white border border-gray-200 rounded-xl p-4 group relative"
	id="folder-{{ .ID }}"
	data-id="{{ .ID }}"
	data-name="{{ .Name }}"
	data-type="folder"
	draggable="true"
	ondragstart="dragStart(event)"
	ondragend="dragEnd(event)"
	ondrop="drop(event)"
	ondragover="allowDrop(event)"
	ondragenter="dragEnter(event)"
	ondragleave="dragLeave(event)"
>
	<a href="/web/folder/{{ .ID }}" class="block">
		<div class="flex items-center space-x-3">
			<div class="flex-shrink-0">
				<svg class="w-10 h-10 text-blue-400" fill="currentColor" viewBox="0 0 24 24"><path d="M10 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg>
			</div>
			<div class="min-w-0 flex-1">
				<p class="text-sm font-medium text-gray-800 truncate">{{ .Name }}</p>
				<p class="text-xs text-gray-400">{{ .CreatedAt.Format "Jan 02, 2006" }}</p>
			</div>
		</div>
	</a>
	<div class="absolute top-2 right-2 opacity-0 group-hover:opacity-100 transition-opacity" style="z-index: 30;">
		<button type="button" class="menu-trigger p-1.5 rounded-md hover:bg-gray-200 text-gray-400 hover:text-gray-600" data-menu="folder-menu-{{ .ID }}">
			<svg class="w-5 h-5 pointer-events-none" fill="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
		</button>
		<div id="folder-menu-{{ .ID }}" class="context-menu hidden absolute right-0 top-8 bg-white rounded-lg shadow-lg border border-gray-200 py-1 w-36" style="z-index: 40;">
			<button type="button" class="action-rename w-full text-left px-3 py-2 text-sm text-gray-700 hover:bg-gray-50" data-type="folder" data-id="{{ .ID }}">Rename</button>
			<button type="button" class="action-move w-full text-left px-3 py-2 text-sm text-gray-700 hover:bg-gray-50" data-type="folder" data-id="{{ .ID }}">Move</button>
			<hr class="my-1">
			<button type="button" hx-delete="/web/folder/{{ .ID }}" hx-target="#folder-{{ .ID }}" hx-swap="outerHTML" hx-confirm="Move this folder to trash?" class="w-full text-left px-3 py-2 text-sm text-red-600 hover:bg-red-50">Move to Trash</button>
			<button type="button" hx-delete="/web/scrub-folder/{{ .ID }}" hx-target="#folder-{{ .ID }}" hx-swap="outerHTML" hx-confirm="Permanently delete this folder and all its contents? This cannot be undone." class="w-full text-left px-3 py-2 text-sm text-red-700 hover:bg-red-50 font-semibold">Delete Permanently</button>
		</div>
	</div>
</div>
{{ end }}{{ end }}
